<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Illustrator Quiz 3: Shapes &amp; Drawing Tools</title><style>body{font:16px system-ui,Arial,sans-serif;background:#eef3fa;color:#142b47;margin:0}.wrap{max-width:820px;margin:30px auto;padding:25px;background:white;border-radius:14px;box-shadow:0 5px 22px #b5c3d3}h1{color:#183e75}fieldset{border:1px solid #c8d6e7;border-radius:9px;margin:20px 0;padding:18px}legend{font-weight:700}label{display:block;padding:10px;margin:5px 0;border-radius:6px;cursor:pointer}label:hover{background:#f0f5ff}button{background:#1b4c91;color:white;border:0;padding:12px 22px;border-radius:8px;font-size:16px;cursor:pointer;margin:5px}button:disabled{opacity:.6;cursor:default}.good{background:#e1f6e6}.bad{background:#ffe5e5}#result{font-size:21px;font-weight:bold;padding:15px}#notice{color:#9c2828;font-weight:700}.actions{margin-top:20px}@media(max-width:600px){.wrap{margin:0;padding:18px;border-radius:0}}@media print{button,#notice{display:none}.wrap{box-shadow:none}}</style></head><body><main class="wrap"><h1>Quiz 3: Shapes &amp; Drawing Tools • Episodes 8–12</h1><p>Gareth David Studio • Illustrator beginner course • 15 questions • Select one answer for each question.</p><p id="progress" aria-live="polite">0 of 15 answered</p><form id="quiz"></form><p id="notice" role="alert"></p><div class="actions"><button type="button" id="submit">Submit &amp; Grade Quiz</button><button type="button" id="retake">Retake Quiz</button><button type="button" id="print" hidden>Print Results</button></div><div id="result" role="status" aria-live="polite"></div></main><script>const Q=[{"question": "Which tool combines overlapping regions by dragging through them?", "options": ["Gradient Tool", "Shape Builder Tool", "Type Tool", "Artboard Tool"], "answer": 1}, {"question": "Which tool creates straight segments by clicking anchor points?", "options": ["Hand Tool", "Eyedropper Tool", "Pen Tool", "Blob Brush Tool"], "answer": 2}, {"question": "What happens when you drag with the Pen Tool?", "options": ["You automatically delete the path", "You lock the layer", "You change the color mode", "You create direction handles for curves"], "answer": 3}, {"question": "Which tool draws freehand paths?", "options": ["Pencil Tool", "Artboard Tool", "Type Tool", "Slice Tool"], "answer": 0}, {"question": "What does the Blob Brush Tool create?", "options": ["Linked images", "Filled vector shapes", "Raster pixels only", "Live text characters"], "answer": 1}, {"question": "What does the Eraser Tool remove from editable vector artwork?", "options": ["Only text formatting", "Only saved swatches", "Parts of paths or shapes", "All document artboards"], "answer": 2}, {"question": "What is grouping useful for?", "options": ["Rasterizing a document", "Changing all fonts to outlines", "Exporting each anchor point", "Moving several objects together"], "answer": 3}, {"question": "What does a compound path allow?", "options": ["Multiple subpaths acting as one path, including holes", "Only one anchor point per file", "Automatic bitmap conversion", "A new artboard per object"], "answer": 0}, {"question": "Which tool draws rectangles?", "options": ["Pencil Tool", "Rectangle Tool", "Polygon Tool", "Curvature Tool"], "answer": 1}, {"question": "What is the purpose of anchor points?", "options": ["Record font licensing", "Choose printer paper", "Define positions and geometry of paths", "Store exported file names"], "answer": 2}, {"question": "Which tool creates text on the page?", "options": ["Pen Tool", "Shape Builder Tool", "Blend Tool", "Type Tool"], "answer": 3}, {"question": "What is kerning?", "options": ["Spacing between a specific pair of letters", "Spacing between text lines", "Text size in points", "Paragraph indentation"], "answer": 0}, {"question": "What is leading?", "options": ["Gradient direction", "Vertical distance between lines of type", "Stroke weight", "Artboard bleed"], "answer": 1}, {"question": "What is tracking?", "options": ["Anchor-point rotation", "Print resolution", "Overall spacing across a range of characters", "Object transparency"], "answer": 2}, {"question": "Which tool can put text along a drawn curve?", "options": ["Area Type Tool", "Artboard Tool", "Width Tool", "Type on a Path Tool"], "answer": 3}];const f=document.getElementById('quiz'),progress=document.getElementById('progress'),notice=document.getElementById('notice'),result=document.getElementById('result'),submit=document.getElementById('submit'),print=document.getElementById('print');function build(){f.replaceChildren();Q.forEach((x,i)=>{const fs=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=(i+1)+'. '+x.question;fs.append(legend);x.options.forEach((o,k)=>{const l=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=k;input.addEventListener('change',update);l.append(input,document.createTextNode(' '+String.fromCharCode(65+k)+'. '+o));fs.append(l)});f.append(fs)});update()}function selected(i){const x=f.querySelector('input[name="q'+i+'"]:checked');return x?Number(x.value):-1}function update(){const count=Q.filter((_,i)=>selected(i)!==-1).length;progress.textContent=count+' of '+Q.length+' answered';notice.textContent=''}function grade(){const missing=Q.map((_,i)=>selected(i)===-1?i+1:null).filter(Boolean);if(missing.length){notice.textContent='Please answer question'+(missing.length===1?' ':'s ')+missing.join(', ')+' before submitting.';f.children[missing[0]-1].scrollIntoView({behavior:'smooth',block:'center'});return}let score=0;Q.forEach((x,i)=>{const fs=f.children[i],val=selected(i);if(val===x.answer)score++;[...fs.querySelectorAll('label')].forEach((l,k)=>{l.classList.toggle('good',k===x.answer);l.classList.toggle('bad',k===val&&val!==x.answer)});fs.querySelectorAll('input').forEach(input=>input.disabled=true)});result.textContent='Your score: '+score+' / '+Q.length+' ('+Math.round(100*score/Q.length)+'%). Green = correct answer; red = your incorrect choice.';submit.disabled=true;print.hidden=false;notice.textContent='';result.scrollIntoView({behavior:'smooth',block:'center'})}function retake(){result.textContent='';submit.disabled=false;print.hidden=true;notice.textContent='';build();window.scrollTo({top:0,behavior:'smooth'})}submit.addEventListener('click',grade);document.getElementById('retake').addEventListener('click',retake);print.addEventListener('click',()=>window.print());build();</script></body></html>
